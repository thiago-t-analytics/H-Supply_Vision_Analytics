<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Supply Vision — Sistema de Inteligência Estratégica</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>

    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div class="logo-container">
                <img src="assets/hero-bg.png" alt="H-Supply Vision" class="logo-img">
            </div>

            <div class="success-badge">
                <span class="check">✓</span>
                <span>Sistema online e operacional</span>
            </div>

            <h1 class="hero-title">
                Bem-vindo ao <span class="highlight">H-Supply Vision</span>
            </h1>

            <p class="hero-subtitle">
                Sistema de Inteligência Estratégica da Cadeia de Suprimento Hospitalar
            </p>

            <div class="hero-stats">
                <div class="stat">
                    <span class="stat-number" data-target="17">0</span>
                    <span class="stat-label">Tabelas integradas</span>
                </div>
                <div class="stat">
                    <span class="stat-number" data-target="26000">0</span>
                    <span class="stat-label">Registros processados</span>
                </div>
                <div class="stat">
                    <span class="stat-number" data-target="100">0</span>
                    <span class="stat-label">% em nuvem</span>
                </div>
            </div>

            <a href="dashboard.html" class="cta-button">
                <span>Acessar Dashboard</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <p class="powered-by">Powered by <strong>T-Analytics</strong></p>
        </div>
    </div>

    <script src="landing.js"></script>
</body>
</html>
